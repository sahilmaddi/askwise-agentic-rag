name: askwise

# docker compose up --build   then open http://localhost:3000 (app), :3000/api/docs (API), :3001 (Grafana)
# Quick start without downloading a model: LLM_PROVIDER=extractive EMBEDDINGS_PROVIDER=hashing docker compose up

services:
  api:
    build: ./backend
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:1b}
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-fastembed}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      VECTOR_STORE: ${VECTOR_STORE:-faiss}
      CHUNKER: ${CHUNKER:-recursive}
      OLLAMA_BASE_URL: http://ollama:11434
      TIKA_URL: http://tika:9998
      SEED_SAMPLES: "true"
      CORS_ORIGINS: http://localhost:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: askwise-api
      # Cloud providers, used only when selected above
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      OPENAI_API_VERSION: ${OPENAI_API_VERSION:-2024-10-21}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    volumes:
      - askwise-data:/data
    ports: ["8000:8000"]
    depends_on:
      tika: { condition: service_started }
      otel-collector: { condition: service_started }
      ollama-pull: { condition: service_completed_successfully, required: false }

  web:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api]

  # Apache Tika: text from Word, PowerPoint, HTML and more; the -full image adds Tesseract OCR for scans.
  tika:
    image: apache/tika:3.1.0.0-full

  ollama:
    image: ollama/ollama:0.6.8
    volumes:
      - ollama-models:/root/.ollama

  # Downloads the open model once (about 1.3 GB for llama3.2:1b), then exits. Skipped for other providers.
  ollama-pull:
    image: ollama/ollama:0.6.8
    entrypoint:
      - /bin/sh
      - -c
      - >-
        if [ "${LLM_PROVIDER:-ollama}" != "ollama" ]; then exit 0; fi;
        until ollama list > /dev/null 2>&1; do sleep 1; done;
        ollama pull ${LLM_MODEL:-llama3.2:1b}
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on: [ollama]

  # Observability: the API sends OTLP to the collector, which forwards traces to Tempo and exposes metrics
  # to Prometheus. Grafana ships with both data sources and an Askwise dashboard.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.124.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro

  prometheus:
    image: prom/prometheus:v3.3.1
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus, tempo]

volumes:
  askwise-data:
  ollama-models:

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: askwise-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: askwise-api
spec:
  # One replica while the FAISS index lives on a ReadWriteOnce volume. To scale out, set VECTOR_STORE to
  # milvus or azure_search so every replica shares one index.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: askwise-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: askwise-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: askwise-api
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: askwise-config
            - secretRef:
                name: askwise-secrets
                optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: askwise-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app.kubernetes.io/name: askwise-api
  ports:
    - port: 8000
      targetPort: 8000

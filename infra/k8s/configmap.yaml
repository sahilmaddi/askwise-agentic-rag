apiVersion: v1
kind: ConfigMap
metadata:
  name: askwise-config
data:
  LLM_PROVIDER: azure
  LLM_MODEL: gpt-4o-mini
  EMBEDDINGS_PROVIDER: azure
  EMBEDDINGS_MODEL: text-embedding-3-small
  VECTOR_STORE: faiss
  CHUNKER: recursive
  TIKA_URL: http://tika:9998
  SEED_SAMPLES: "true"
  OTEL_SERVICE_NAME: askwise-api
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
---
# Create the real secret out of band, e.g.:
#   kubectl -n askwise create secret generic askwise-secrets \
#     --from-literal=AZURE_OPENAI_ENDPOINT=https://<resource>.openai.azure.com \
#     --from-literal=AZURE_OPENAI_API_KEY=<key> --from-literal=OPENAI_API_VERSION=2024-10-21
# The api Deployment marks the secret optional so the manifests apply cleanly without it.

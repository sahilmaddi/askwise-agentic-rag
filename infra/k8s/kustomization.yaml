apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: askwise
labels:
  - pairs:
      app.kubernetes.io/part-of: askwise
resources:
  - namespace.yaml
  - configmap.yaml
  - api.yaml
  - web.yaml
  - tika.yaml
  - ingress.yaml
images:
  - name: askwise-api
    newName: ghcr.io/sahilmaddi/askwise-api
    newTag: latest
  - name: askwise-web
    newName: ghcr.io/sahilmaddi/askwise-web
    newTag: latest
